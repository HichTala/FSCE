_BASE_: "../../Base-RCNN-FPN.yaml"
MODEL:
  WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-50.pkl"
  MASK_ON: False
  RESNETS:
    DEPTH: 50
  ROI_HEADS:
    NUM_CLASSES: 16
INPUT:
  MIN_SIZE_TRAIN: (480, 512, 544, 576, 608, 640, 672, 704, 736, 768, 800)
  MIN_SIZE_TEST: 512
DATASETS:
  TRAIN: ('dota_train')
  VAL: ('dota_val')
  TEST: ('dota_test',)
SOLVER:
  STEPS: (30000, 40000)
  MAX_ITER: 45000
  WARMUP_ITERS: 100
OUTPUT_DIR: "checkpoints/dota/faster_rcnn/faster_rcnn_R_50_FPN_base1"
